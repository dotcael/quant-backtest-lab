[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant"
version = "0.1.0"
description = "Local-first crypto market data pipeline: pull, validate, store OHLCV for later backtesting."
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4",
    "pandas>=2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
insider = ["yfinance>=0.2", "networkx>=3"]

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
